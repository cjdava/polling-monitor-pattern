version: 0.2

# ---------------------------------------------------------------------------
# CodeBuild spec — Lambda Durable, SAM approach.
#
# What this does:
#   1. Runs `sam package` which zips each Lambda, uploads code + ASL to S3,
#      and rewrites template.yaml into a plain CloudFormation template
#      (packaged.yaml) ready for the Deploy stage.
# ---------------------------------------------------------------------------

phases:
  install:
    runtime-versions:
      python: 3.12

  pre_build:
    commands:
      - echo "Running sam package for v1..."

  build:
    commands:
      - cd v1
      - sam package
          --template-file template.yaml
          --s3-bucket $ARTIFACT_BUCKET
          --output-template-file ../packaged.yaml

  post_build:
    commands:
      - echo "sam package complete. packaged.yaml ready for Deploy stage."

artifacts:
  files:
    - packaged.yaml
